; OH_Node V0 – test firmware: Ethernet (W5500, ESP-IDF driver), Wi-Fi, relays, audio + RTP stream
; ESP32-S3-WROOM-1-N16R2: 16 MB flash, 2 MB quad PSRAM
[env:oh_node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200


; Network update: pio run -e oh_node_ota -t upload  (tries Ethernet IP first, then Wi-Fi IP)
[env:oh_node_ota]
extends = env:oh_node
upload_protocol = custom
upload_command = sh -c 'for h in 192.168.114.176 192.168.114.114; do echo "OTA via $$h"; curl -sS --fail-with-body --connect-timeout 3 --max-time 120 --data-binary @$SOURCE http://$$h/update && exit 0; done; exit 1'
