<text x="12" y="700" font-size="14" fill="#1f2328">• Terminal screws are under the windows in the lid; wires enter through the side walls.</text>
<text x="12" y="720" font-size="14" fill="#1f2328">• Relays: COM to NO closes when the relay is on, COM to NC when it is off. Contacts are isolated from the board, max. 10 A each;</text>
<text x="12" y="740" font-size="14" fill="#1f2328">•     neighbouring relays may switch different phases.</text>
<text x="12" y="760" font-size="14" fill="#1f2328">• PIRs and strips are numbered from the bottom, relays from the left, on both revisions (firmware since 2026-10-27).</text>
<text x="12" y="780" font-size="14" fill="#1f2328">• PIR output must switch to GND (contact or open collector). A sensor that drives 3.3 V on motion reads inverted.</text>
<text x="12" y="800" font-size="14" fill="#1f2328">• WS2812 strips get 5 V from their own supply; connect its GND to the strip and to the terminal's GND.</text>
</svg>
